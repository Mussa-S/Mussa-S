name: Import portfolio screenshot assets

on:
  push:
    paths:
      - "imports/portfolio-assets/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate and install portfolio screenshots
        shell: bash
        run: |
          set -euo pipefail

          archive="imports/portfolio-assets/portfolio-assets-webp.zip"

          if [[ ! -f "$archive" ]]; then
            echo "Expected $archive"
            exit 1
          fi

          webp_count="$(unzip -Z1 "$archive" | grep -E '^projects/[0-9]{2}-[^/]+/screenshots/[^/]+\.webp$' | wc -l | tr -d ' ')"

          if [[ "$webp_count" != "54" ]]; then
            echo "Expected 54 portfolio screenshots, found $webp_count"
            exit 1
          fi

          for project in projects/01-Splunk-Windows-Authentication                          projects/02-Web-Attack-Investigation                          projects/03-SOC104-Malware-Investigation                          projects/04-SOC145-Ransomware-Investigation                          projects/05-SOC141-Phishing-URL-Investigation                          projects/06-SOC140-Phishing-Attachment-Investigation                          projects/07-PayPal-Phishing-Investigation                          projects/08-Wireshark-Network-Traffic-Investigation; do
            rm -f "$project/screenshots/evidence-01.webp"
          done

          unzip -o "$archive" -d .

          # The imported evidence is WebP for a much smaller Git footprint while
          # keeping the original screenshot names and investigation structure.
          find projects -mindepth 2 -maxdepth 2 -name README.md -print0 |
            xargs -0 sed -i -E 's#(screenshots/[^)]+)\.png\)#\1.webp)#g'

          rm -rf imports/portfolio-assets

      - name: Commit restored screenshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
            exit 0
          fi

          git commit -m "Restore portfolio investigation screenshots [skip ci]"
          git push
